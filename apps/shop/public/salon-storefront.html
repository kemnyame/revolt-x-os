<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a haircut</title>
<style>
:root{--ink:#111b22;--cream:#f6f2eb;--dark:#10191f;--teal:#159b8c;--gold:#d8a45d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--cream);color:var(--ink)}
.hero{min-height:58vh;background:linear-gradient(115deg,rgba(10,18,23,.96),rgba(16,45,45,.93));color:#fff;padding:32px 7vw;display:flex;flex-direction:column;justify-content:center}.brand{font-weight:950;letter-spacing:.08em;color:#d4e8e5}.hero h1{font-size:clamp(42px,7vw,78px);line-height:.98;max-width:900px;margin:22px 0 16px}.hero p{max-width:650px;color:#bcd0cd;font-size:18px;line-height:1.6}.cta{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;background:var(--teal);color:#fff;cursor:pointer}.btn.gold{background:var(--gold);color:#172026}
.wrap{max-width:1100px;margin:auto;padding:34px 20px}.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.title h2{margin:0;font-size:30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e4ded5;border-radius:17px;padding:18px;box-shadow:0 14px 34px rgba(46,36,24,.06)}.price{font-size:23px;font-weight:950;color:#0d756b}.muted{color:#7b807f}.book{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd8d0;border-radius:10px;background:#fff}.wide{grid-column:1/-1}.msg{margin-top:12px;color:#0b756a;font-weight:800}
@media(max-width:760px){.grid,.book{grid-template-columns:1fr}.wide{grid-column:auto}.hero{min-height:50vh}}
</style></head><body>
<section class="hero"><div class="brand">REVOLT-X BARBERING</div><h1 id="shopName">Sharp cuts. Simple booking.</h1><p id="shopInfo">Choose a service, book your preferred time and arrive ready for a clean experience.</p><div class="cta"><button class="btn gold" onclick="document.getElementById('booking').scrollIntoView({behavior:'smooth'})">Book now</button><button class="btn" onclick="document.getElementById('services').scrollIntoView({behavior:'smooth'})">View services</button></div></section>
<div class="wrap" id="services"><div class="title"><div><h2>Services</h2><div class="muted">Barbering, beard care and premium grooming</div></div></div><div class="grid" id="serviceGrid"></div></div>
<div class="wrap" id="booking"><div class="title"><div><h2>Book your chair</h2><div class="muted">Your appointment appears instantly in the salon workspace.</div></div></div><div class="card"><form id="bookForm" class="book"><div class="field"><label>Name</label><input name="customerName" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Service</label><select name="serviceId" id="serviceSelect"></select></div><div class="field wide"><label>Date & time</label><input name="bookedFor" type="datetime-local" required></div><div class="field wide"><label>Notes / haircut preference</label><textarea name="notes"></textarea></div><div class="field wide"><button class="btn">Confirm appointment</button></div></form><div id="msg" class="msg"></div></div></div>
<script>
const slug=location.pathname.split('/').filter(Boolean).pop();let data;
fetch('/api/public/store/'+encodeURIComponent(slug)).then(r=>r.json()).then(x=>{data=x;shopName.textContent=x.shop.name;shopInfo.textContent=[x.shop.address,x.shop.phone].filter(Boolean).join(' · ');serviceGrid.innerHTML=x.services.map(s=>'<div class="card"><b>'+s.name+'</b><p class="muted">'+(s.description||'Professional grooming service')+'</p><div class="price">GHS '+Number(s.price).toFixed(2)+'</div><small class="muted">'+s.duration_minutes+' minutes</small></div>').join('');serviceSelect.innerHTML='<option value="">Choose service</option>'+x.services.map(s=>'<option value="'+s.id+'">'+s.name+' · GHS '+Number(s.price).toFixed(2)+'</option>').join('')});
bookForm.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(bookForm));f.bookedFor=new Date(f.bookedFor).toISOString();if(!f.serviceId)delete f.serviceId;const r=await fetch('/api/public/store/'+encodeURIComponent(slug)+'/bookings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(f)});const b=await r.json().catch(()=>({}));msg.textContent=r.ok?'Appointment confirmed. Booking reference: '+b.id:(b?.error?.message||'Booking could not be created');if(r.ok)bookForm.reset()};
</script></body></html>
