name: Apply report fee policy patch

on:
  push:
    paths:
      - 'scripts/patch-report-fee-policy.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: node scripts/patch-report-fee-policy.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/school/src/server.ts apps/school/src/ui.ts
          git commit -m "Enforce configurable fee gate on report delivery"
          git push
