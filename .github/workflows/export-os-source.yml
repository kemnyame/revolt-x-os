name: Export Revolt-X OS Source
# export-trigger-2026-09-21-a

on:
  push:
    paths:
      - ".github/workflows/export-os-source.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Build Core OS
        run: |
          npm ci
          npm run build

      - name: Create source and runtime ZIPs
        run: |
          mkdir -p export/source export/runtime/revolt-x-os
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='.env' ./ export/source/revolt-x-os/
          rsync -a dist migrations package.json package-lock.json Dockerfile README.md .env.example export/runtime/revolt-x-os/
          cd export/source
          zip -r ../revolt-x-os-source.zip revolt-x-os
          cd ../runtime
          zip -r ../revolt-x-os-runtime-build.zip revolt-x-os
          cd ..
          printf "Repository: kemnyame/revolt-x-os\nBranch: main\nCommit: %s\nGenerated: %s\n" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BUILD_INFO.txt

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: revolt-x-os-source
          path: |
            export/revolt-x-os-source.zip
            export/revolt-x-os-runtime-build.zip
            export/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
