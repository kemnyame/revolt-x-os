name: Export Revolt-X School Build
# export-trigger-2026-09-21-a

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/export-school-build.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Build Revolt-X School
        working-directory: apps/school
        run: |
          npm install
          npm run build

      - name: Create source and runtime ZIPs
        run: |
          mkdir -p export/runtime/revolt-x-school
          zip -r export/revolt-x-school-source.zip apps/school             -x "apps/school/node_modules/*" "apps/school/dist/*" "apps/school/.env"
          rsync -a apps/school/dist apps/school/migrations apps/school/package.json apps/school/package-lock.json apps/school/.env.example apps/school/README.md export/runtime/revolt-x-school/
          cd export/runtime
          zip -r ../revolt-x-school-runtime-build.zip revolt-x-school

      - name: Add build metadata
        run: |
          printf "Repository: kemnyame/revolt-x-os\nBranch: main\nCommit: %s\nGenerated: %s\n" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > export/BUILD_INFO.txt

      - name: Upload current build
        uses: actions/upload-artifact@v4
        with:
          name: revolt-x-school-current-build
          path: |
            export/revolt-x-school-source.zip
            export/revolt-x-school-runtime-build.zip
            export/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
