name: Commercial launch cleanup

on:
  push:
    branches:
      - fix/commercial-launch-20261011

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/commercial-launch-20261011
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Core OS dependencies
        run: npm ci

      - name: Materialize existing School remediation patches
        working-directory: apps/school
        run: |
          npm install
          npm run build

      - name: Materialize commercial launch cleanup
        run: node scripts/commercial-launch-cleanup.mjs

      - name: Validate Core OS
        run: |
          npm run build
          npm test

      - name: Validate Revolt-X School without source-mutating build scripts
        working-directory: apps/school
        run: npm run build

      - name: Commit authoritative cleaned source
        run: |
          git config user.name "Revolt-X Release Bot"
          git config user.email "emmanuelnyame25@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Prepare Revolt-X School and OS for commercial launch"
          git push origin HEAD:fix/commercial-launch-20261011
