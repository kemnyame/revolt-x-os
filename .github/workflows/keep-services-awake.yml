name: Keep Revolt-X Services Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake Core OS and School
        shell: bash
        run: |
          failed=0
          for url in \
            "https://revolt-x-os.onrender.com/health/live" \
            "https://revolt-x-school.onrender.com/health/live"
          do
            echo "Pinging $url"
            if curl --fail --show-error --silent \
              --connect-timeout 10 \
              --max-time 50 \
              --retry 2 \
              --retry-delay 5 \
              --retry-all-errors \
              --retry-max-time 130 \
              "$url"
            then
              echo
              echo "Healthy: $url"
            else
              echo "::warning::Could not wake $url during this cycle; the next scheduled run will retry."
              failed=1
            fi
          done
          exit 0
